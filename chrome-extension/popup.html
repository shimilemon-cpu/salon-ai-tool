<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>HPB タグ入力支援</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <span class="title">HPB タグ入力支援</span>
    <div class="mode-toggle">
      <button class="toggle-btn active" data-mode="fill">✏️ 自動入力</button>
      <button class="toggle-btn" data-mode="copy">📋 コピー</button>
    </div>
  </div>

  <!-- URLが未設定のとき -->
  <div id="urlSetup" style="display:none" class="url-setup">
    <p class="setup-lead">初回設定：サロンAIツールのURLを入力してください</p>
    <div class="url-row">
      <input id="urlInput" type="text" class="url-input" placeholder="例：https://xxx-3000.preview.app.github.dev" />
      <button id="urlSave" class="url-save-btn">保存</button>
    </div>
    <p class="setup-hint">ブラウザのアドレスバーからコピーしてください</p>
  </div>

  <!-- URL設定済みのとき -->
  <div id="main" style="display:none">
    <div class="fetch-bar">
      <button id="fetchBtn" class="fetch-btn">🔄 最新タグを取得</button>
      <button id="urlChange" class="url-change-btn" title="URLを変更">⚙</button>
    </div>
    <p id="fetchStatus" class="fetch-status"></p>

    <div id="hpbWarning" class="warning" style="display:none">
      ⚠ HPBページで拡張を開くと自動入力が使えます
    </div>

    <div id="emptyState" class="empty-state">
      <p>① サロンAIツールでHPBコンテンツを生成</p>
      <p>② 上の「最新タグを取得」を押す</p>
      <p>③ HPB管理画面でタグをワンクリック入力</p>
    </div>

    <div id="tagsArea" style="display:none">
      <p id="aiMeta" class="ai-meta"></p>
      <div id="tagCategories"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
